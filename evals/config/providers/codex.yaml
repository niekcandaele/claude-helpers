# The Codex provider block, inserted verbatim into the generated config.
#
# The requested model defaults to SKILL_EVAL_CODEX_MODEL. Not every model is
# reachable on a ChatGPT subscription — `gpt-5.1-codex-max` is rejected with
# HTTP 400 "not supported when using Codex with a ChatGPT account".
- id: openai:codex-sdk
  label: codex
  config:
    model: ${SKILL_EVAL_CODEX_MODEL}
    model_reasoning_effort: medium
    working_dir: ${WORKSPACE}
    sandbox_mode: read-only
    approval_policy: never
    network_access_enabled: false
    skip_git_repo_check: true
    inherit_process_env: true
    cli_env:
      HOME: ${WORK}/home
      CODEX_HOME: ${WORK}/codex-home
      OPENAI_API_KEY: ""
      CODEX_API_KEY: ""
