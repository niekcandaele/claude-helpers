# The Promptfoo skeleton the generator fills in for one trial.
#
# This file is a template, not a runnable config: scripts/evals/prepare.py
# inserts exactly one provider block — read from config/providers/<harness>.yaml
# and substituted — plus exactly one test built from the case, then writes the
# rendered result into the trial's work directory and copies it into the saved
# evidence.
#
# Everything here is harness-neutral. What differs between harnesses lives in
# providers/, and nowhere else: that is what makes "the same case on both" a
# claim the diff can support.
description: skills repository — behavior evaluation
evaluateOptions:
  cache: false
providers: []   # the generator inserts exactly one provider block
prompts:
  - "{{request}}"
tests: []       # the generator inserts exactly one test built from the case
